[profile.default]
src = "contracts"
out = "out"
libs = ["node_modules", "lib"]
solc = "0.8.28"
evm_version = "cancun"

[fmt]
tab_width = 4
sort_imports = true

[rpc_endpoints]
mainnet = "${ETHEREUM_RPC_URL}"
arbitrum = "${ARBITRUM_RPC_URL}"

[etherscan]
mainnet = { key = "${ETHEREUM_EXPLORER_API_KEY}", url = "${ETHEREUM_EXPLORER_URL}" }
arbitrum = { key = "${ARBITRUM_EXPLORER_API_KEY}", url = "${ARBITRUM_EXPLORER_URL}" }
